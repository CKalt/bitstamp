# Dynamic Bollinger Band Adaptive Strategy
# Uses tighter bands and no confirmation for ranging trades

name: "Adaptive Multi-Strategy - Dynamic BB"
description: "Tighter Bollinger Bands for more ranging opportunities"

# Data settings
data_source: "btcusd.log"

# Initial capital
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true

# Fees and costs
fee_percentage: 0.0012
slippage_bps: 0.0

# Trade limits
max_trades_per_day: 10
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 0.00000001

# Risk management
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0

# Strategy configuration
strategy:
  name: "Adaptive Multi-Strategy"
  type: "adaptive"
  parameters: {}

# Regime detection - favor ranging
regime_detection:
  lookback_bars: 100
  whipsaw_threshold: 0.70    # Higher = stays in ranging more
  trend_strength_threshold: 0.35  # Higher = harder to detect trends
  volatility_window: 50
  confidence_threshold: 0.55

# TRENDING regime - standard
trending_strategy:
  short_window: 10
  long_window: 30
  confirmation_bars: 2

# RANGING regime - much more active
ranging_strategy:
  bb_window: 12      # Shorter period = more responsive
  bb_std_dev: 1.2    # Tighter bands = more touches
  rsi_window: 10     # Shorter RSI = more signals
  rsi_oversold: 40   # Less extreme = more buy signals
  rsi_overbought: 60 # Less extreme = more sell signals
  exit_at_opposite_band: true

# VOLATILE regime
volatile_strategy:
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_threshold: 100

# Pivot protection settings
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
    - profit_pct: 5
      protection_pct: 70
    - profit_pct: 10
      protection_pct: 80
    - profit_pct: 15
      protection_pct: 85
    - profit_pct: 20
      protection_pct: 90

# Output settings
output_dir: "backtest_results"
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false