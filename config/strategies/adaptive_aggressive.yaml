# Aggressive Adaptive Multi-Strategy Configuration
# Targets approximately 1 trade per day with faster signals

name: "Adaptive Multi-Strategy - Aggressive"
description: "Aggressive configuration for more frequent trading"

# Data settings
data_source: "btcusd.log"

# Initial capital
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true

# Fees and costs
fee_percentage: 0.0012
slippage_bps: 0.0

# Trade limits - increased for more activity
max_trades_per_day: 10
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 0.00000001

# Risk management
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0

# Strategy configuration
strategy:
  name: "Adaptive Multi-Strategy"
  type: "adaptive"
  parameters: {}

# Regime detection - faster switching
regime_detection:
  lookback_bars: 50          # Reduced from 100
  whipsaw_threshold: 0.55    # Reduced from 0.65
  trend_strength_threshold: 0.2  # Reduced from 0.3
  volatility_window: 30      # Reduced from 50
  confidence_threshold: 0.5  # Reduced from 0.6

# TRENDING regime - faster signals
trending_strategy:
  short_window: 5    # Reduced from 10
  long_window: 20    # Reduced from 30
  confirmation_bars: 1  # Reduced from 2

# RANGING regime - tighter bands, more signals
ranging_strategy:
  bb_window: 15      # Reduced from 20
  bb_std_dev: 1.5    # Reduced from 2.0
  rsi_window: 14
  rsi_oversold: 35   # Increased from 30
  rsi_overbought: 65 # Reduced from 70
  exit_at_opposite_band: true

# VOLATILE regime - more sensitive
volatile_strategy:
  macd_fast: 8       # Reduced from 12
  macd_slow: 21      # Reduced from 26
  macd_signal: 7     # Reduced from 9
  breakout_threshold: 50  # Reduced from 100

# Pivot protection settings
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
    - profit_pct: 5
      protection_pct: 70
    - profit_pct: 10
      protection_pct: 80
    - profit_pct: 15
      protection_pct: 85
    - profit_pct: 20
      protection_pct: 90

# Output settings
output_dir: "backtest_results"
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false