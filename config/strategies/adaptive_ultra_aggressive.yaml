# Ultra Aggressive Adaptive Multi-Strategy Configuration
# Maximum trading frequency with minimal confirmation

name: "Adaptive Multi-Strategy - Ultra Aggressive"
description: "Ultra aggressive for maximum trading frequency"

# Data settings
data_source: "btcusd.log"

# Initial capital
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true

# Fees and costs
fee_percentage: 0.0012
slippage_bps: 0.0

# Trade limits - maximum allowed
max_trades_per_day: 10
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 0.00000001

# Risk management
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0

# Strategy configuration
strategy:
  name: "Adaptive Multi-Strategy"
  type: "adaptive"
  parameters: {}

# Regime detection - very responsive
regime_detection:
  lookback_bars: 30          # Very short lookback
  whipsaw_threshold: 0.45    # Very low threshold
  trend_strength_threshold: 0.15  # Easy trend detection
  volatility_window: 20      # Short window
  confidence_threshold: 0.4  # Low confidence needed

# TRENDING regime - hair trigger
trending_strategy:
  short_window: 3    # Ultra fast
  long_window: 10    # Very responsive
  confirmation_bars: 0  # No confirmation!

# RANGING regime - extreme settings
ranging_strategy:
  bb_window: 10      # Very short period
  bb_std_dev: 1.0    # Very tight bands
  rsi_window: 7      # Ultra short RSI
  rsi_oversold: 45   # Mild oversold
  rsi_overbought: 55 # Mild overbought
  exit_at_opposite_band: true

# VOLATILE regime - hair trigger
volatile_strategy:
  macd_fast: 5       # Ultra fast
  macd_slow: 15      # Responsive
  macd_signal: 5     # Quick signal
  breakout_threshold: 25  # Very low threshold

# Pivot protection settings
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
    - profit_pct: 5
      protection_pct: 70
    - profit_pct: 10
      protection_pct: 80
    - profit_pct: 15
      protection_pct: 85
    - profit_pct: 20
      protection_pct: 90

# Output settings
output_dir: "backtest_results"
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false