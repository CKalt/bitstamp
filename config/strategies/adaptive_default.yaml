# Default Adaptive Multi-Strategy Configuration
# This configuration matches the current live trading system parameters

name: "Adaptive Multi-Strategy - Default"
description: "Default configuration matching live trading parameters"

# Data settings
data_source: "btcusd.log"
# start_date: "2024-01-01"  # Optional: defaults to all available data
# end_date: "2024-12-31"    # Optional: defaults to all available data

# Initial capital
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true  # Always 100% BTC or 100% USD

# Fees and costs
fee_percentage: 0.0012  # 0.12% Bitstamp fee
slippage_bps: 0.0      # No slippage modeling by default

# Trade limits (matching live system)
max_trades_per_day: 5
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 0.00000001

# Risk management
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0

# Strategy configuration
strategy:
  name: "Adaptive Multi-Strategy"
  type: "adaptive"
  parameters: {}

# Regime detection parameters
regime_detection:
  lookback_bars: 100
  whipsaw_threshold: 0.65
  trend_strength_threshold: 0.3
  volatility_window: 50
  confidence_threshold: 0.6

# TRENDING regime strategy (MA Crossover)
trending_strategy:
  short_window: 10
  long_window: 30
  confirmation_bars: 2

# RANGING regime strategy (Bollinger Band Mean Reversion)
ranging_strategy:
  bb_window: 20
  bb_std_dev: 2.0
  rsi_window: 14
  rsi_oversold: 30
  rsi_overbought: 70
  exit_at_opposite_band: true

# VOLATILE regime strategy (MACD Breakout)
volatile_strategy:
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_threshold: 100

# Pivot protection settings
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
    - profit_pct: 5
      protection_pct: 70
    - profit_pct: 10
      protection_pct: 80
    - profit_pct: 15
      protection_pct: 85
    - profit_pct: 20
      protection_pct: 90

# Output settings
output_dir: "backtest_results"
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false

# Optimization settings (for future use)
optimization:
  enabled: false
  metric: "sharpe_ratio"
  method: "grid_search"