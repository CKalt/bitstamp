name: Conservative
description: Testing parameter variations
data_source: btcusd.log
start_date: '2025-06-19'
end_date: '2025-07-19'
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true
fee_percentage: 0.0012
slippage_bps: 0.0
max_trades_per_day: 5
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 1.0e-08
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0
strategy:
  name: Adaptive Multi-Strategy
  type: adaptive
  parameters: {}
regime_detection:
  confidence_threshold: 0.7
  lookback_bars: 150
  trend_strength_threshold: 0.4
  volatility_window: 75
  whipsaw_threshold: 0.75
trending_strategy:
  confirmation_bars: 3
  long_window: 40
  short_window: 15
ranging_strategy:
  bb_std_dev: 2.5
  bb_window: 25
  exit_at_opposite_band: true
  rsi_overbought: 75
  rsi_oversold: 25
  rsi_window: 14
volatile_strategy:
  breakout_threshold: 150
  macd_fast: 12
  macd_signal: 9
  macd_slow: 26
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
  - profit_pct: 5
    protection_pct: 70
  - profit_pct: 10
    protection_pct: 80
  - profit_pct: 15
    protection_pct: 85
  - profit_pct: 20
    protection_pct: 90
output_dir: backtest_results
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false
optimization:
  enabled: false
  metric: sharpe_ratio
  method: grid_search
