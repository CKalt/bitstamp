name: Adaptive Multi-Strategy - Frequent
description: Balanced configuration for daily trading activity
data_source: btcusd.log
start_date: '2025-06-19'
end_date: '2025-07-19'
initial_btc: 0.0
initial_usd: 100000.0
always_in_market: true
fee_percentage: 0.0012
slippage_bps: 0.0
max_trades_per_day: 10
max_trades_per_hour: 3
min_trade_gap_minutes: 15
min_btc_trade_size: 1.0e-08
enable_pivot_protection: true
enable_trailing_stops: true
emergency_exit_loss: -2000.0
pivot_buffer: 100.0
strategy:
  name: Adaptive Multi-Strategy
  type: adaptive
  parameters: {}
regime_detection:
  lookback_bars: 75
  whipsaw_threshold: 0.6
  trend_strength_threshold: 0.25
  volatility_window: 40
  confidence_threshold: 0.55
trending_strategy:
  short_window: 8
  long_window: 25
  confirmation_bars: 2
ranging_strategy:
  bb_window: 18
  bb_std_dev: 1.8
  rsi_window: 14
  rsi_oversold: 32
  rsi_overbought: 68
  exit_at_opposite_band: true
volatile_strategy:
  macd_fast: 10
  macd_slow: 24
  macd_signal: 8
  breakout_threshold: 75
pivot_protection:
  lookback_hours: 24
  buffer_amount: 100.0
  sticky_duration_hours: 4
  profit_thresholds:
  - profit_pct: 5
    protection_pct: 70
  - profit_pct: 10
    protection_pct: 80
  - profit_pct: 15
    protection_pct: 85
  - profit_pct: 20
    protection_pct: 90
output_dir: backtest_results
save_trades: true
save_signals: true
save_equity_curve: true
generate_plots: false
optimization:
  enabled: false
  metric: sharpe_ratio
  method: grid_search
